<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager - Login</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="images/icon.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <h1>Task Manager - Login</h1>
        <p>Welcome back! Please log in to access your tasks.</p>

        <main class="app-card">
            <!-- Returning user login view -->
            <a href="index.html" class="back-btn-link">&larr; Back</a>
                <h2>Login</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" name="username" required>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>

                    <a href="dash.html">
                        <button type="submit" id="login-submit-btn" class="btn-primary">Log In</button>
                    </a>
                </form>

                <div class="auth-toggle">
                    <span>Don't have an account?</span>
                    <a href="signup.html" class="back-btn-link">Sign Up</a>
                </div>
        </main>

        <script type="module" src="login.js"></script>
    </body>
