<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskie - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/Taskie.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="top-nav">
        <!--Logo-->
        <div class="nav-brand">
            <img src="images/sublogo.png" alt="Alternative Taskie Logo" class="app-logo">
            <span class="app-title">Taskie</span>
        </div>

        <!--User profile Section-->
        <div class="nav-user">
            <button class="user-dropdown-btn" id="user-menu-toggle">
                <img src="images/user.png" alt="Profile Picture" class="nav-profile-pic">
            </button>

            <!--Dropdown Menu-->
            <div class="dropdown-menu hidden" id="user-dropdown">
                <div class="dropdown-header">
                    <strong id="dropdown-user-name">Loading...</strong>
                    <span id="dropdown-user-email">user@example.com</span>
                </div>
                <!-- Theme Selector Dots Container (Blue, Red, Green) -->
                <div class="theme-dots-container">
                    <label class="theme-dot-switch" title="Click me ☺">
                        <input type="checkbox" id="blue-theme-toggle">
                        <span class="theme-dot blue-dot"></span>
                    </label>
    
                    <label class="theme-dot-switch" title="Click me ☺">
                        <input type="checkbox" id="red-theme-toggle">
                        <span class="theme-dot red-dot"></span>
                    </label>
                </div>

                <div class="notification-toggle-wrapper">
                        <!--Toggle button comes first-->
                        <label class="switch">
                            <input type="checkbox" id="notification-toggle">
                            <span class="slider"></span>
                        </label>
                        <!-- Text comes after -->
                        <span class="toggle-label">Enable reminders</span>
                    </div>
                    
                <button id="logout-btn" class="dropdown-item logout-item">Log Out</button>
            </div>
        </div>
    </nav>
    <!--Dashboard main area-->
    <main class="dash-container">
        <!--Header and action section-->
        <header class="dash-header">
            <div class="welcome-section">
                <h1 id="welcome-title" title="Yes, we know your name ☺" style="font-size: 30px">
                    Welcome... ♥
                </h1>
            </div>
            <!--Create task group-->
            <div class="action-bar">
                <form id="create-group-form" class="group-form">
                    <input 
                        type="text"
                        id="group-name-input"
                        placeholder="Enter group name..."
                        required
                        autocomplete="off"
                    />
                    <button type="submit" class="btn-create">+ Create Group</button>
                </form>
            </div>
        </header>
        <!--Group cards grid-->
        <section id="groups-container" class="groups-grid">
            <!--Groups will render here-->
        </section>
    </main>
    <!--function to enable touch and hold reorganising-->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script type="module" src="dash.js"></script>
</body>
</html>
